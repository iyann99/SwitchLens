<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Koleksi Favoritmu ❤️ - SwitchLens</title>

  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://switchlens.vercel.app/favorites.html">

  <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="shortcut icon" href="/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="SwitchLens" />
  <link rel="manifest" href="/icons/site.webmanifest" />
  
  <meta name="google-site-verification" content="WxDj8l9F1ZDV_EmsvDcZfuHmyfCdKsSxDBabFustOgk" />

  <link rel="stylesheet" href="css/home.css" type="text/css" media="all" />
</head>

<body data-theme="light">
<header>
  <nav>
    <a href="home.html" class="logo-container">
      <span class="logo1">Switch</span><span class="logo2">Lens</span>
    </a>
    <div class="navContainerBtn">
        <a href="index.html" class="btnVideo">Kembali ke Beranda</a>
    </div>
  </nav>
</header>

<main class="main-container">
  <div class="favorites-header" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px;">
      <h2 style="margin: 0;" class="subJudul">Koleksi Favoritmu ❤️</h2>
      
      <div class="filter-controls" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; background: var(--card); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(15, 41, 30, 0.05); border: 1px solid rgba(0, 178, 45, 0.1);">
          
          <div class="search-wrapper-fav" style="flex-grow: 1; max-width: 400px; min-width: 250px;">
              <input type="text" id="searchFav" placeholder="Cari judul, author, atau provider..." style="width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(0, 178, 45, 0.2); background: var(--main); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; outline: none; transition: border-color 0.2s;">
          </div>
          
          <div class="sort-wrapper" style="display: flex; align-items: center; gap: 10px;">
              <label for="sortFav" style="font-size: 0.9rem; font-weight: 700; color: var(--text-secondary);">Urutkan:</label>
              <select id="sortFav" style="padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(0, 178, 45, 0.2); background: var(--main); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; font-weight: 600; outline: none; cursor: pointer;">
                  <option value="newest">Terbaru</option>
                  <option value="oldest">Terlama</option>
                  <option value="az">A - Z (Judul)</option>
                  <option value="za">Z - A (Judul)</option>
                  <option value="provider">Sumber API</option>
              </select>
          </div>

      </div>
  </div>

  <div class="gallery-grid" id="gallery-grid">
  </div>
</main>

<div id="lightbox">
  <span id="closeLightbox">&times;</span>
  <img id="lightboxImg" src="" alt="Full Screen Preview" />
</div>

<div class="token-modal" id="messageModal">
    <div class="modal-box" style="text-align: center; max-width: 380px; padding: 30px 25px;">
        <h2 id="messageTitle" style="color: var(--text-primary); margin-bottom: 12px; font-size: 1.4rem;">Pemberitahuan</h2>
        <p id="messageBody" style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 25px; line-height: 1.6;">Pesan di sini</p>
        <button id="closeMessageBtn">Tutup</button>
    </div>
</div>

<footer>
  <p>&copy; 2026 | Built by Iyann99</p>
</footer>

<script src="js/config.js" defer></script>
<script src="js/favorites.js" defer></script>
<script src="js/button.js" defer></script>
<script src="js/register-sw.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
