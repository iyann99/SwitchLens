<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daftar - SwitchLens</title>
  <meta name="description" content="Buat akun SwitchLens gratis untuk mulai menyimpan koleksi favorit kamu.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://switchlens.vercel.app/register.html">

  <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  <link rel="shortcut icon" href="/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="SwitchLens" />
  <link rel="manifest" href="/icons/site.webmanifest" />

  <link rel="stylesheet" href="css/home.css" type="text/css" media="all" />
  <link rel="stylesheet" href="css/auth.css" type="text/css" media="all" />
</head>

<body data-theme="light">
<header>
  <nav>
    <a href="index.html" class="logo-container">
      <span class="logo1">Switch</span><span class="logo2">Lens</span>
    </a>
  </nav>
</header>

<main class="auth-container">
  <div class="auth-box">
    <h1>Buat Akun Baru</h1>
    <p class="auth-subtitle">Gratis. Cukup email dan password untuk mulai menyimpan favorit.</p>

    <form id="registerForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="nama@email.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required autocomplete="new-password" minlength="6">

      <label for="passwordConfirm">Konfirmasi Password</label>
      <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Ulangi password" required autocomplete="new-password" minlength="6">

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAD-PpjPvSwIM3gjA" data-theme="light" style="margin-top: 16px;"></div>

      <div id="authError" class="auth-error" hidden></div>

      <button type="submit" id="registerSubmit">Daftar</button>
    </form>

    <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>
</main>

<div class="token-modal" id="messageModal">
    <div class="modal-box" style="text-align: center; max-width: 380px; padding: 30px 25px;">
        <h2 id="messageTitle" style="color: var(--text-primary); margin-bottom: 12px; font-size: 1.4rem;">Pemberitahuan</h2>
        <p id="messageBody" style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 25px; line-height: 1.6;">Pesan di sini</p>
        <button id="closeMessageBtn">Tutup</button>
    </div>
</div>

<footer>
  <p>&copy; 2026 | Built by Iyan99</p>
</footer>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="js/config.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/register-sw.js" defer></script>
</body>
</html>
